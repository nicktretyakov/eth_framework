[package]
name = "eth_framework"
version = "0.1.0"
edition = "2021"

[dependencies]
ethers = { version = "=2.0.14", default-features = false, features = ["abigen", "rustls"] }
tokio = { version = "=1.36.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
eyre = "=0.6.12"
async-trait = "=0.1.77"
thiserror = "=1.0.57"
log = "=0.4.21"
env_logger = "=0.10.2"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"

# Fixed scale stack — library and derive MUST be the same version
# (codec-derive 3.7 generates code needing __private from codec 3.7 lib)
parity-scale-codec = { version = "=3.6.9", default-features = false, features = ["derive", "full"] }
parity-scale-codec-derive = "=3.6.9"
scale-info = { version = "=2.11.0", default-features = false, features = ["derive"] }
scale-info-derive = "=2.11.0"
